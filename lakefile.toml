name = "tusnady"
version = "0.2.0"
defaultTargets = ["Tusnady", "Tusnady.Upper", "Tusnady.Integrated", "Wei", "Tusnady.Audit.Dependencies"]

[[lean_lib]]
name = "Tusnady"

[[lean_lib]]
name = "Wei"

[lean_lib.leanOptions]
pp.unicode.fun = true
autoImplicit = false
linter.unusedSectionVars = false
linter.unusedVariables = false
linter.unusedSimpArgs = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"
